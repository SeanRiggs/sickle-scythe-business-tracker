<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7f1d1d"><link rel="manifest" href="manifest.webmanifest"><title>Sickle & Scythe Business Tracker</title><style>body{font-family:system-ui;background:#020617;color:#f8fafc;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:20px;margin:16px 0}button{background:#b91c1c;color:white;border:0;border-radius:10px;padding:12px 16px;margin:4px;cursor:pointer}button.alt{background:#334155}.status{padding:8px 12px;border-radius:999px;background:#422006;color:#fde68a;display:inline-block}pre{white-space:pre-wrap;word-break:break-word;background:#020617;padding:12px;border-radius:10px}small{color:#94a3b8}</style></head><body><div class="wrap"><div class="card"><h1>Sickle & Scythe</h1><small>Business Tracker Cloud Sync Setup</small><p id="status" class="status">Not signed in</p></div><div class="card"><h2>Microsoft OneDrive</h2><button id="signin">Sign in with Microsoft</button><button id="load" class="alt">Load from OneDrive</button><button id="save" class="alt">Save test database</button><button id="signout" class="alt">Sign out</button><p id="message">This cloud-connectivity build verifies Microsoft sign-in and the private OneDrive App Folder before the full tracker interface is migrated.</p></div><div class="card"><h2>Data Preview</h2><pre id="preview">No cloud data loaded.</pre></div></div><script src="app.js?v=3"></script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js?v=3");</script></body></html>
